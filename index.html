<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grill-Essen Aufteilung</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}.container{max-width:1100px;margin:0 auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}h1{text-align:center;color:#5b5bd6;margin-bottom:18px}.section{background:#f7f7fb;border-radius:12px;padding:18px;margin:16px 0}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{background:#5b5bd6;color:#fff;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700}.btn.secondary{background:#7a48a6}input,select{width:100%;padding:11px;border:2px solid #ddd;border-radius:10px;font-size:15px}label{display:block;margin-bottom:6px;font-weight:700;color:#444}.list{margin-top:12px}.card{background:#fff;border-left:4px solid #5b5bd6;padding:12px;border-radius:10px;margin:10px 0}.stars{display:flex;gap:6px;flex-wrap:wrap}.star-btn{width:42px;height:42px;border-radius:10px;border:2px solid #ddd;background:#fff;cursor:pointer;font-size:18px}.star-btn.active{background:#5b5bd6;color:#fff;border-color:#5b5bd6}.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.sum{background:#7a48a6;color:#fff;padding:14px;border-radius:12px;margin-top:14px;font-weight:700}.muted{color:#666;font-size:14px}.person-grid{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:end}.small{font-size:12px;color:#666;margin-top:4px}
</style>
</head>
<body>
<div class="container">
<h1>Grill-Essen Aufteilung</h1>
<div class="section">
<h2>Personen</h2>
<div class="row2">
<div><label>Name</label><input id="personName" placeholder="z.B. Teddy"></div>
<div><label>Gesamt Gramm</label><input id="personGrams" type="number" min="0" placeholder="z.B. 600"></div>
<div style="display:flex;align-items:end"><button class="btn" onclick="addPerson()">Person hinzufügen</button></div>
</div>
<div class="list" id="personsList"></div>
</div>
<div class="section">
<h2>Produkte</h2>
<div class="row">
<div><label>Produkt</label><input id="productName" placeholder="z.B. Wurst"></div>
<div><label>Kategorie</label><input id="productCategory" placeholder="z.B. Fleisch"></div>
<div><label>Gramm</label><input id="productGrams" type="number" min="0" placeholder="z.B. 250"></div>
<div><label>Preis</label><input id="productPrice" type="number" step="0.01" min="0" placeholder="z.B. 4.99"></div>
</div>
<div class="row2" style="margin-top:10px">
<div><label>Bewertung</label><input id="productRating" type="number" min="0" max="4" placeholder="0-4"></div>
<div style="display:flex;align-items:end"><button class="btn" onclick="addProduct()">Produkt hinzufügen</button></div>
</div>
<div class="list" id="productsList"></div>
</div>
<div class="section">
<h2>Ratings pro Person</h2>
<div id="ratingsArea"></div>
<button class="btn secondary" onclick="calculateDistribution()">Berechnen</button>
</div>
<div class="section">
<h2>Ergebnis</h2>
<div id="results"></div>
</div>
</div>
<script>
let persons=[];let products=[];let ratings={};
function save(){localStorage.setItem('persons',JSON.stringify(persons));localStorage.setItem('products',JSON.stringify(products));localStorage.setItem('ratings',JSON.stringify(ratings))}
function load(){persons=JSON.parse(localStorage.getItem('persons')||'[]');products=JSON.parse(localStorage.getItem('products')||'[]');ratings=JSON.parse(localStorage.getItem('ratings')||'{}');renderAll()}
function addPerson(){const name=document.getElementById('personName').value.trim();const grams=parseFloat(document.getElementById('personGrams').value);if(!name||isNaN(grams))return;persons.push({name,grams});document.getElementById('personName').value='';document.getElementById('personGrams').value='';save();renderAll()}
function addProduct(){const name=document.getElementById('productName').value.trim();const category=document.getElementById('productCategory').value.trim();const grams=parseFloat(document.getElementById('productGrams').value);const price=parseFloat(document.getElementById('productPrice').value);const rating=parseInt(document.getElementById('productRating').value||'0');if(!name||isNaN(grams)||isNaN(price))return;products.push({name,category,grams,price,rating});document.getElementById('productName').value='';document.getElementById('productCategory').value='';document.getElementById('productGrams').value='';document.getElementById('productPrice').value='';document.getElementById('productRating').value='';save();renderAll()}
function setRating(person,product,value){if(!ratings[person])ratings[person]={};ratings[person][product]=value;save();renderRatings()}
function renderPersons(){document.getElementById('personsList').innerHTML=persons.map((p,i)=>`<div class="card">${i+1}. ${p.name} - ${p.grams}g</div>`).join('')}
function renderProducts(){document.getElementById('productsList').innerHTML=products.map((p,i)=>`<div class="card">${i+1}. ${p.name} (${p.category||'keine Kategorie'}) - ${p.grams}g - €${p.price.toFixed(2)} - ${p.rating} Sterne</div>`).join('')}
function renderRatings(){const area=document.getElementById('ratingsArea');if(!persons.length||!products.length){area.innerHTML='<p class="muted">Bitte zuerst Personen und Produkte anlegen.</p>';return}area.innerHTML=persons.map(person=>`<div class="card"><h3>${person.name}</h3>${products.map(prod=>{const current=(ratings[person.name]&&ratings[person.name][prod.name])??0;return `<div class="person-grid"><div><div><strong>${prod.name}</strong><div class="small">${prod.category||''}</div></div></div><div><input type="number" min="0" max="4" value="${current}" onchange="setRating('${person.name.replaceAll("'","\'")}','${prod.name.replaceAll("'","\'")}',parseInt(this.value||'0'))"></div></div>`}).join('')}</div>`).join('')}
function renderAll(){renderPersons();renderProducts();renderRatings();document.getElementById('results').innerHTML=''}
function calculateDistribution(){let html='';persons.forEach(person=>{const personRatings=ratings[person.name]||{};const active=products.map(p=>({p,r:parseInt(personRatings[p.name]??0)})).filter(x=>x.r>0);const total=active.reduce((s,x)=>s+x.r,0);html+=`<div class="card"><h3>${person.name} - ${person.grams}g</h3>`;if(total===0){html+='<p class="muted">Keine Produkte mit Rating > 0.</p></div>';return}html+=`<table class="table"><tr><th>Produkt</th><th>Rating</th><th>Gramm</th></tr>`;let assigned=0;active.forEach((x,idx)=>{let g=idx===active.length-1?person.grams-assigned:Math.round(person.grams*(x.r/total));assigned+=g;html+=`<tr><td>${x.p.name}</td><td>${x.r}</td><td>${g}g</td></tr>`});html+='</table></div>'});document.getElementById('results').innerHTML=html}
load();
</script>
</body>
</html>
